<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080b10" />
    <title>Sayfa bulunamadı | Aldemir Software</title>
    <link rel="icon" href="/logo-nonbck.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 50% 30%, #1a263a, transparent 65%), #080b10;
        color: #f1f3f7;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 600px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .brand {
        font-size: 13px;
        letter-spacing: 3px;
        margin: 15px 0 50px;
      }
      .code {
        color: #8291a8;
        font-size: 14px;
        letter-spacing: 4px;
      }
      h1 {
        font-size: clamp(32px, 7vw, 48px);
        font-weight: 500;
        letter-spacing: -1.5px;
        line-height: 1.2;
        margin: 18px 0;
      }
      p {
        color: #a2aec0;
        line-height: 1.8;
        font-size: 16px;
      }
      a {
        display: inline-block;
        margin-top: 22px;
        padding: 14px 24px;
        border-radius: 6px;
        background: #edf0f5;
        color: #151b25;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s;
      }
      a:hover {
        background: white;
      }
      a:focus-visible {
        outline: 2px solid #ef3545;
        outline-offset: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/logo-nonbck.png"
        alt="Aldemir Software logosu"
        width="96"
        height="96"
      />
      <p class="brand">ALDEMİR SOFTWARE</p>
      <span class="code">HATA / 404</span>
      <h1>Bu sayfayı bulamadık.</h1>
      <p>
        Bağlantı değişmiş veya sayfa kaldırılmış olabilir.<br />Ana sayfadan
        devam edebilirsiniz.
      </p>
      <a href="/">Ana sayfaya dön ↗</a>
    </main>
  </body>
</html>
